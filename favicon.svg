<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Lock favicon. No text, no blur, no gradient: at 16px those all turn
       to mush. Deep steel tile so the brass mark reads on light AND dark
       browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#0B1015"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#243642"/>
  <!-- shackle -->
  <path d="M11 14.5V11a5 5 0 0 1 10 0v3.5"
        fill="none" stroke="#C8A45C" stroke-width="3.2" stroke-linecap="round"/>
  <!-- body -->
  <rect x="7" y="14" width="18" height="13" rx="2.6" fill="#C8A45C"/>
  <!-- keyhole -->
  <circle cx="16" cy="19.4" r="2.1" fill="#0B1015"/>
  <rect x="14.9" y="19.4" width="2.2" height="4.4" rx="1.1" fill="#0B1015"/>
</svg>
